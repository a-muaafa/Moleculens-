name: MolecuLens Automated Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Pytest, security gates & QSAR evaluation (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile all sources (syntax gate)
        run: python -m compileall -q .

      - name: Reproducible QSAR LogP evaluation on a clean environment
        run: |
          mkdir -p results
          python scripts/evaluate_logp.py

      - name: Verify offline-first core tests (ALLOW_EXTERNAL_NETWORK=false)
        env:
          ALLOW_EXTERNAL_NETWORK: "false"
        run: |
          pytest -v tests/test_offline_and_caching.py tests/test_titration_all_catalog.py tests/test_rdkit_fallback_parity.py

      - name: Run full test suite once (with coverage and JUnit report)
        run: |
          rm -f data/moleculens_local.db
          mkdir -p results
          set -o pipefail
          pytest -v --tb=short \
            --junitxml=results/junit.xml \
            --cov=. --cov-report=xml:coverage.xml --cov-report=term \
            | tee results/pytest_summary.txt

      - name: Write job summary from the real test output
        if: always()
        run: |
          echo "## MolecuLens Automated QA Summary" >> "$GITHUB_STEP_SUMMARY"
          if [ -f results/pytest_summary.txt ]; then
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 30 results/pytest_summary.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Test run did not produce output (a previous step failed)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test, coverage and QSAR artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moleculens-qa-artifacts
          path: |
            coverage.xml
            results/logp_eval.json
            results/junit.xml
            results/pytest_summary.txt
          if-no-files-found: warn
